# ================================================================
# Rhema Care Flow — Netlify (SECUNDARIO)
# Deploy automatico via GitHub Actions (workflow ci.yml)
# Manual: app.netlify.com > Add new site > Import from GitHub
# ================================================================
[build]
  command     = "npm run build"
  publish     = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS    = "--legacy-peer-deps"

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Assets com cache longo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Seguranca
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-XSS-Protection       = "1; mode=block"
