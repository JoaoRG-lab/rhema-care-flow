name: TMR Deployment Auditor

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rotate:
        description: 'Force rotate to last clean SHA'
        required: false
        default: 'false'

concurrency:
  group: tmr-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  INSTALL_FLAGS: '--legacy-peer-deps'
  SCORE_THRESHOLD: '85'
  VOTER_QUORUM: '2'

jobs:
  auditor-i1:
    name: 'AUDITOR I1 - Node 20 cache'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
      duration: ${{ steps.result.outputs.duration }}
      error: ${{ steps.result.outputs.error }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        id: install
        run: |
          START=$(date +%s)
          npm install --legacy-peer-deps
          echo "start=$START" >> "$GITHUB_OUTPUT"
      - name: Build
        id: build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Result
        id: result
        if: always()
        run: |
          END=$(date +%s)
          START="${{ steps.install.outputs.start }}"
          echo "duration=$((END - START))s" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "error=none" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "error=build-failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload dist
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dist-i1
          path: dist/
          retention-days: 3

  auditor-i2:
    name: 'AUDITOR I2 - Node 20 no-cache'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
      duration: ${{ steps.result.outputs.duration }}
      error: ${{ steps.result.outputs.error }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        id: install
        run: |
          START=$(date +%s)
          npm install --legacy-peer-deps
          echo "start=$START" >> "$GITHUB_OUTPUT"
      - name: Build
        id: build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Result
        id: result
        if: always()
        run: |
          END=$(date +%s)
          START="${{ steps.install.outputs.start }}"
          echo "duration=$((END - START))s" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "error=none" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "error=build-failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload dist
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dist-i2
          path: dist/
          retention-days: 3

  auditor-i3:
    name: 'AUDITOR I3 - Node 20 clean install'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
      duration: ${{ steps.result.outputs.duration }}
      error: ${{ steps.result.outputs.error }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        id: install
        run: |
          START=$(date +%s)
          npm install --legacy-peer-deps
          echo "start=$START" >> "$GITHUB_OUTPUT"
      - name: Build
        id: build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Result
        id: result
        if: always()
        run: |
          END=$(date +%s)
          START="${{ steps.install.outputs.start }}"
          echo "duration=$((END - START))s" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "error=none" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "error=build-failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload dist
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dist-i3
          path: dist/
          retention-days: 3

  voter:
    name: 'VOTER - 2-of-3 Byzantine Majority'
    runs-on: ubuntu-latest
    needs: [auditor-i1, auditor-i2, auditor-i3]
    if: always()
    outputs:
      verdict: ${{ steps.vote.outputs.verdict }}
      pass_count: ${{ steps.vote.outputs.pass_count }}
      winner: ${{ steps.vote.outputs.winner }}
      score: ${{ steps.score.outputs.value }}
    steps:
      - name: Cast votes
        id: vote
        run: |
          I1="${{ needs.auditor-i1.outputs.status }}"
          I2="${{ needs.auditor-i2.outputs.status }}"
          I3="${{ needs.auditor-i3.outputs.status }}"
          PASS=0
          WINNER="none"
          [ "$I1" = "pass" ] && PASS=$((PASS + 1)) && WINNER="i1"
          [ "$I2" = "pass" ] && PASS=$((PASS + 1)) && [ "$WINNER" = "none" ] && WINNER="i2"
          [ "$I3" = "pass" ] && PASS=$((PASS + 1)) && [ "$WINNER" = "none" ] && WINNER="i3"
          echo "pass_count=$PASS" >> "$GITHUB_OUTPUT"
          echo "winner=$WINNER" >> "$GITHUB_OUTPUT"
          if [ "$PASS" -ge "${{ env.VOTER_QUORUM }}" ]; then
            echo "verdict=APPROVED" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=REJECTED" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute score
        id: score
        run: |
          PASS="${{ steps.vote.outputs.pass_count }}"
          SCORE=$((PASS * 33))
          [ "$PASS" -eq 3 ] && SCORE=100
          echo "value=$SCORE" >> "$GITHUB_OUTPUT"
          echo "Score: $SCORE/100 ($PASS/3 auditors passed)"

  deploy:
    name: 'DEPLOY - Vercel (voter approved)'
    runs-on: ubuntu-latest
    needs: voter
    if: needs.voter.outputs.verdict == 'APPROVED'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  report:
    name: 'REPORT - Consolidated TMR result'
    runs-on: ubuntu-latest
    needs: [auditor-i1, auditor-i2, auditor-i3, voter]
    if: always()
    permissions:
      issues: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate report
        id: report
        run: |
          VERDICT="${{ needs.voter.outputs.verdict }}"
          SCORE="${{ needs.voter.outputs.score }}"
          PASS="${{ needs.voter.outputs.pass_count }}"
          WINNER="${{ needs.voter.outputs.winner }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          I1="${{ needs.auditor-i1.outputs.status }}"
          I2="${{ needs.auditor-i2.outputs.status }}"
          I3="${{ needs.auditor-i3.outputs.status }}"
          D1="${{ needs.auditor-i1.outputs.duration }}"
          D2="${{ needs.auditor-i2.outputs.duration }}"
          D3="${{ needs.auditor-i3.outputs.duration }}"
          icon() { [ "$1" = "pass" ] && echo "PASS" || echo "FAIL"; }
          cat > /tmp/report.md <<MDEOF
          ## TMR Verdict: $VERDICT
          **Commit:** \`$SHORT_SHA\` | **Score:** $SCORE/100 | **Quorum:** $PASS/3 | **Winner:** $WINNER

          | Auditor | Node | Status | Duration |
          |---------|------|--------|----------|
          | I1 | 20 cache | $(icon "$I1") | $D1 |
          | I2 | 20 no-cache | $(icon "$I2") | $D2 |
          | I3 | 20 clean | $(icon "$I3") | $D3 |

          _Generated by TMR Auditor - Run ${{ github.run_id }}_
          MDEOF
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
      - name: Open Issue if REJECTED
        if: needs.voter.outputs.verdict == 'REJECTED'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/report.md', 'utf8');
            const sha = '${{ github.sha }}'.substring(0, 7);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `TMR REJECTED: build ${sha} failed quorum`,
              body: report,
              labels: ['tmr-killed', 'deploy-failure']
            });
      - name: Comment on commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/report.md', 'utf8');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: '${{ github.sha }}',
              body: report
            });
