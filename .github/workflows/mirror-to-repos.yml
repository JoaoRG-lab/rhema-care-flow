name: Mirror to external repos

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load target repos
        id: targets
        run: |
          if [ ! -f .github/mirror-targets.json ]; then
            echo "No .github/mirror-targets.json found — nothing to mirror."
            echo "list=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t REPOS < <(jq -r '.targets[]?' .github/mirror-targets.json)
          if [ "${#REPOS[@]}" -eq 0 ]; then
            echo "Target list is empty — nothing to mirror."
          fi
          printf '%s\n' "${REPOS[@]}"
          {
            echo 'list<<EOF'
            printf '%s\n' "${REPOS[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify MIRROR_TOKEN is set
        if: steps.targets.outputs.list != ''
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "::error::MIRROR_TOKEN secret is not configured. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "MIRROR_TOKEN is configured."

      - name: Check token permissions per target
        if: steps.targets.outputs.list != ''
        id: perms
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -u
          WRITABLE=()
          FAILED=()
          {
            echo "## 🔐 Mirror permission check"
            echo ""
            echo "| Target | Status | Reason |"
            echo "|--------|--------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue
            HTTP_BODY=$(mktemp)
            HTTP_CODE=$(curl -sS -o "$HTTP_BODY" -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${MIRROR_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}")

            if [ "$HTTP_CODE" = "200" ]; then
              PUSH=$(jq -r '.permissions.push // false' "$HTTP_BODY")
              ARCHIVED=$(jq -r '.archived // false' "$HTTP_BODY")
              if [ "$ARCHIVED" = "true" ]; then
                FAILED+=("$REPO")
                echo "| \`$REPO\` | ❌ skipped | repository is archived |" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::$REPO is archived — skipping"
              elif [ "$PUSH" = "true" ]; then
                WRITABLE+=("$REPO")
                echo "| \`$REPO\` | ✅ writable | push permission granted |" >> "$GITHUB_STEP_SUMMARY"
                echo "✅ $REPO — writable"
              else
                FAILED+=("$REPO")
                echo "| \`$REPO\` | ❌ skipped | token lacks push permission |" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::$REPO — token has no push permission"
              fi
            elif [ "$HTTP_CODE" = "404" ]; then
              FAILED+=("$REPO")
              echo "| \`$REPO\` | ❌ skipped | not found or token can't see it |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$REPO — 404 (does not exist or token has no access)"
            elif [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              FAILED+=("$REPO")
              echo "| \`$REPO\` | ❌ skipped | HTTP $HTTP_CODE (auth failed) |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$REPO — HTTP $HTTP_CODE auth/scope problem"
            else
              FAILED+=("$REPO")
              echo "| \`$REPO\` | ❌ skipped | HTTP $HTTP_CODE |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$REPO — unexpected HTTP $HTTP_CODE"
            fi
            rm -f "$HTTP_BODY"
          done <<< "${{ steps.targets.outputs.list }}"

          echo ""
          echo "Writable: ${#WRITABLE[@]} | Failed: ${#FAILED[@]}"

          {
            echo 'writable<<EOF'
            printf '%s\n' "${WRITABLE[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "failed_count=${#FAILED[@]}" >> "$GITHUB_OUTPUT"

      - name: Push to writable targets
        if: steps.perms.outputs.writable != ''
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -e
          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue
            echo "::group::Mirroring to $REPO"
            REMOTE="https://x-access-token:${MIRROR_TOKEN}@github.com/${REPO}.git"
            if git push --prune "$REMOTE" "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"; then
              echo "✅ pushed to $REPO" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Push to $REPO failed"
              echo "❌ push failed: $REPO" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.perms.outputs.writable }}"

      - name: Fail job if any target was skipped
        if: steps.perms.outputs.failed_count != '0' && steps.perms.outputs.failed_count != ''
        run: |
          echo "::error::${{ steps.perms.outputs.failed_count }} target(s) were skipped due to permission issues. See summary above."
          exit 1
