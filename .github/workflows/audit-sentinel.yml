name: Audit Sentinel

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  sentinel-audit:
    name: Sentinel Audit Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run lint --if-present

      - name: Build check
        run: npm run build

      - name: Audit summary
        if: always()
        run: |
          echo "=== Audit Sentinel Summary ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run: ${{ github.run_id }}"
          echo "Status: ${{ job.status }}"
