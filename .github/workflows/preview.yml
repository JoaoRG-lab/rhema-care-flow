name: Preview Deploy (PR)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview to Cloudflare Pages (PR)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci fails on the repository's current peer dependency conflicts.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build preview
        run: npm run build
        env:
          VITE_SUPABASE_URL:             ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy preview to Cloudflare Pages
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rhema-care-flow --branch=pr-${{ github.event.pull_request.number }}
          wranglerVersion: '4'

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo:  context.repo.repo,
              body: [
                '## Preview Deploy',
                '',
                '| Branch | Commit | URL |',
                '|--------|--------|-----|',
                `| \`${{ github.head_ref }}\` | \`${{ github.sha }}\`.slice(0,7) | [Abrir preview](${{ steps.preview.outputs.deployment-url }}) |`,
              ].join('\n')
            });
