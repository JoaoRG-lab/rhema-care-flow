# AI Code Quality Reporter — corrigido 2026-05-21
# Dispara APENAS quando tmr-deploy.yml termina com verdict REJECTED
# ou score < 85. Não roda em build normal.

name: AI Code Quality Reporter

on:
  # Dispara quando tmr-deploy.yml conclui
  workflow_run:
    workflows: ['TMR Deployment Auditor']
    types: [completed]
    branches: [main]

jobs:
  report-on-tmr-failure:
    name: Relatório consolidado pós-TMR
    runs-on: ubuntu-latest
    # Só roda se o TMR terminou com falha (voter rejeitou)
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Montar relatório de falha TMR
        id: build_report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run   = context.payload.workflow_run;
            const sha   = run.head_sha.slice(0, 7);
            const actor = run.triggering_actor?.login || 'unknown';
            const runUrl = run.html_url;
            const branch = run.head_branch;

            // Busca issues TMR abertas neste SHA para evitar duplicata
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              labels: 'tmr-killed',
              state:  'open',
              per_page: 5
            });

            const alreadyOpen = existing.data.some(i => i.title.includes(sha));
            if (alreadyOpen) {
              console.log(`Issue TMR para ${sha} já existe. Pulando.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[TMR] ❌ Build ${sha} rejeitado — rotate executado (${branch})`,
              labels: ['ai-report', 'tmr-killed', 'deploy-failure', 'needs-review'],
              body: [
                '## 🔱 TMR Deployment Auditor — Rejeição',
                '',
                `**Commit:** \`${sha}\``,
                `**Branch:** \`${branch}\``,
                `**Autor:** @${actor}`,
                `**Run TMR:** [Ver workflow](${runUrl})`,
                '',
                '---',
                '## O que aconteceu',
                '',
                'O voter 2-of-3 não atingiu quorum mínimo.',
                'O build foi **morto instantaneamente** e `main` foi rotacionado',
                'para o último SHA limpo conhecido (`tmr-good-*`).',
                '',
                'O SHA falho foi preservado em branch `tmr/killed-*` para diagnóstico.',
                '',
                '---',
                '## Checklist de diagnóstico',
                '- [ ] Inspecionar branch `tmr/killed-*`',
                '- [ ] Verificar qual réplica falhou (R1/R2/R3) nos logs do TMR',
                '- [ ] Identificar: peer dep? TypeScript? import quebrado? env var?',
                '- [ ] Corrigir e fazer novo push para main',
                '',
                '---',
                '> Revisores: @JoaoRG-lab',
                '> Sistema: TMR Deployment Auditor v1',
              ].join('\n'),
            });
